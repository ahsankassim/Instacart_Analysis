name: 'dbt_folder'

profile: 'instacart_dbt'

seed-paths: ["seeds"]
model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

# seeds:
#   # Builds seeds into '<your_schema_name>_raw'
#   dbt:
#     +schema: raw

models:
  dbt_folder:
    +static_analysis: strict
    # Materialize staging models as views, and marts as tables
    staging:
      +materialized: view
      +schema: staging
    # intermediate:
    #   +materialized: view
    #   +schema: intermediate
    # marts:
    #   +schema: marts
    #   +materialized: table
seeds:
  dbt_folder: 
    +schema: seeds