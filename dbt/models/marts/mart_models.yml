models:
  - name: dim_products
    description: one row per product with stats.
    columns:
      - name: product_id 
        tests:
          - unique
          - not_null 
    

  - name: dim_users
    description: one row per user id, generated from unique user_id's in stg_orders model.
    columns:  
      - name: user_id
        tests:
          - unique
          - not_null
