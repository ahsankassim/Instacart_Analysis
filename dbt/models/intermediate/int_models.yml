models:
  - name: product_names
    description: replaces aisle_id and department_id with aisle_name and department_name
  

  - name: product_summary
    description: calculates reorder rate and avg cart position from order_products table for each product
    columns:
      - name: product_id
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: order_count
        tests:
          - not_null
      - name: avg_cart_position
        tests:
          - not_null
      - name: reorder_rate
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: weighted_reorder_rate
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
  

  - name: user_base
    description: simple aggregate calculations based on user_id from orders table.
    columns:
      - name: user_id
        tests: 
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_users')
                field: user_id
      - name: order_count
        tests: 
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: tenure
        tests: 
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: avg_interval
        tests: 
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0


  - name: user_order_summary_1
    description: aggregated order stats per user, which is fed into user_order_summary_2
    columns:
      - name: user_id
        tests: 
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('user_order_summary_2')
                field: user_id
      - name: order_count
        tests: 
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: avg_items_per_order
        tests: 
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: unique_products
        tests: 
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: reorder_rate
        tests: 
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1


  - name: user_order_summary_2
    description: created to calculate weighted_reorder_rate without much clutter.
    columns:
      - name: user_id
        tests: 
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_users')
                field: user_id
      - name: order_count
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: weighted_reorder_rate
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1