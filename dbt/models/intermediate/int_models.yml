models:
  - name: int_product_details
    description: One row per product, enriching the staged product catalogue with its aisle and department names.
  

  - name: int_product_order_metrics
    description: One row per purchased product with order-line volume, average add-to-cart position, raw reorder rate, and a globally smoothed reorder rate calculated from historical order lines.
    columns:
      - name: product_id
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: order_count
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: avg_cart_position
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: reorder_rate
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: weighted_reorder_rate
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
  

  - name: int_user_order_cadence
    description: One row per user with order count, observed ordering tenure, and average time between successive orders.
    columns:
      - name: user_id
        tests: 
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_users')
                field: user_id
      - name: order_count
        tests: 
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: tenure
        tests: 
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: avg_interval
        tests: 
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0


  - name: int_user_order_metrics
    description: One row per user with order count, average items per order, distinct products purchased, and raw reorder rate across orders with observed product lines.
    columns:
      - name: user_id
        tests: 
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('int_user_reorder_metrics')
                field: user_id
      - name: order_count
        tests: 
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: avg_items_per_order
        tests: 
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: unique_products
        tests: 
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: reorder_rate
        tests: 
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1


  - name: int_user_reorder_metrics
    description: One row per user that carries forward user order metrics and adds a globally smoothed reorder rate.
    columns:
      - name: user_id
        tests: 
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_users')
                field: user_id
      - name: order_count
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: weighted_reorder_rate
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
