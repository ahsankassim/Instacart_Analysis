models:
  - name: stg_aisles
    description: Staged Instacart aisle reference data, with one row per aisle.
    columns:
      - name: aisle_id
        tests:
          - unique
          - not_null
      - name: aisle_name
        tests:
          - not_null
          

  - name: stg_departments
    description: Staged Instacart department reference data, with one row per department.
    columns:
      - name: department_id
        tests:
          - unique
          - not_null
      - name: department_name
        tests:
          - not_null


  - name: stg_orders
    description: Staged historical orders from the prior and train populations. Test orders are excluded because their product line items are not supplied. The model renames order_hour_of_day and maps source order_dow values to inferred weekday labels.
    columns:
      - name: order_id
        description: Unique order identifier. Every staged historical order is expected to have at least one associated product line.
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_order_products')
                field: order_id
      - name: user_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_user_order_metrics')
                field: user_id
          - relationships:
              arguments:
                to: ref('int_user_order_cadence')
                field: user_id
      - name: order_number
        tests:
          - not_null
      - name: order_hour
        description: renamed from "order_hour_of_day"
        tests:
          - not_null
      - name: order_day
        description: Weekday label inferred from source order_dow values using the project mapping seed.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday']


  - name: stg_products
    description: Staged product catalogue, with one row per product and its source aisle and department identifiers.
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
      - name: product_name
        tests:
          - not_null
      - name: aisle_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_aisles')
                field: aisle_id
      - name: department_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_departments')
                field: department_id


  - name: stg_order_products
    description: Historical order line items formed by unioning the prior and train source datasets and standardizing reordered as is_reordered.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - product_id
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: add_to_cart_order
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
      - name: is_reordered
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
