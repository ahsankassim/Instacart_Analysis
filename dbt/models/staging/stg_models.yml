models:
  - name: stg_aisles
    columns:
      - name: aisle_id
        tests:
          - unique
          - not_null
      - name: aisle_name
        tests:
          - not_null
          

  - name: stg_departments
    columns:
      - name: department_id
        tests:
          - unique
          - not_null
      - name: department_name
        tests:
          - not_null


  - name: stg_orders
    description: removed the rows which belonged to test set, since they don't have any corresponding values to join themselves with, and since those are dropped and prior and train tables are combined the entire "eval_set" columns in filtered out.
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_order_products')
                field: order_id
                description: "flags rows where order_id has no products; not a real world case scenario but to catch system errors."
      - name: user_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('user_order_summary_1')
                field: user_id
          - relationships:
              arguments:
                to: ref('user_base')
                field: user_id
      - name: order_number
        tests:
          - not_null
      - name: order_hour
        description: renamed from "order_hour_of_day"
        tests:
          - not_null
      - name: order_day
        description: order_dow is replaced with their respective inferred days (inferred since they are provided by the source)
        tests:
          - accepted_values:
              arguments:
                values: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday']


  - name: stg_products
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
      - name: product_name
        tests:
          - not_null
      - name: aisle_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_aisles')
                field: aisle_id
      - name: department_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_departments')
                field: department_id


  - name: stg_order_products
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: add_to_cart_order
        tests:
          - not_null
      - name: is_reordered
        tests:
          - not_null